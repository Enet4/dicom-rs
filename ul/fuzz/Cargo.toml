[package]
name = "dicom-ul-fuzz"
version = "0.0.0"
description = "Fuzz testing for the dicom-ul crate"
authors = []
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.11.1"

[dependencies.dicom-ul]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "pdu_roundtrip"
path = "fuzz_targets/pdu_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "pdata_reader"
path = "fuzz_targets/pdata_reader.rs"
test = false
doc = false

[[bin]]
name = "pdata_writer"
path = "fuzz_targets/pdata_writer.rs"
test = false
doc = false

[profile.release]
debug = true
